version: "3.8"

services:
  broker_mqtt:
    build: ./broker_et_client/broker_mqtt
    image: pledge-broker-mqtt:latest
    container_name: pledge_broker_mqtt
    restart: unless-stopped
    ports:
      - "${MQTTS_PORT:-8883}:8883"
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./broker_et_client/broker_mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./broker_et_client/broker_mqtt/certs:/mosquitto/certs
      - mosquitto_data:/mosquitto/data
    networks:
      - pledge_net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 nc -z 127.0.0.1 8883 || timeout 2 nc -z 127.0.0.1 1883 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3s

  crypto_node:
    build: ./serveur_crypto
    image: streamfog-crypto-node:latest
    container_name: pledge_crypto_node
    restart: unless-stopped
    ports:
      - "${CRYPTO_PORT:-8443}:8443"
    environment:
      CRYPTO_PORT: 8443
      CRYPTO_SECRET_SCALAR: ${CRYPTO_SECRET_SCALAR:-123456789}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/tls.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/tls.key}
    volumes:
      - ./serveur_crypto/certs:/certs
    networks:
      - pledge_net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request, ssl; ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE; urllib.request.urlopen(\"https://127.0.0.1:8443/health\", context=ctx, timeout=3)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  edge_node:
    build: ./broker_et_client/client_mqtt
    image: pledge-client-edge:latest
    container_name: pledge_client_edge
    restart: always
    ports:
      - "${EDGE_WS_PORT:-8444}:${EDGE_WS_PORT:-8444}"
    environment:
      NODE_ID: ${NODE_ID:-Edge_Node_01}
      ZONE_ID: ${ZONE_ID:-Zone_1}
      NODE_HOST: ${NODE_HOST:-127.0.0.1}
      EDGE_WS_PORT: ${EDGE_WS_PORT:-8444}
      EDGE_WS_SCHEME: ${EDGE_WS_SCHEME:-ws}
      BROKER_HOST: ${BROKER_HOST:-broker_mqtt}
      BROKER_PORT: ${BROKER_PORT:-1883}
      CRYPTO_URL: ${CRYPTO_URL:-https://crypto_node:8443}
      EDGE_DATA_DIR: /donnees_isolees
      TELEMETRY_INTERVAL_SEC: ${TELEMETRY_INTERVAL_SEC:-5}
    volumes:
      - edge_storage_data:/donnees_isolees
    networks:
      - pledge_net
    depends_on:
      - broker_mqtt
      - crypto_node
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s = socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\", int(\"${EDGE_WS_PORT:-8444}\")))' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build: ./serveur_web/backend
    image: pledge-backend:latest
    container_name: pledge_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      BROKER_HOST: ${BROKER_HOST:-broker_mqtt}
      BROKER_PORT: ${BROKER_PORT:-1883}
      BROKER_IP: ${BROKER_IP:-broker_mqtt}
      CRYPTO_URL_ZONE_1: ${CRYPTO_URL_ZONE_1:-https://crypto_node:8443}
      CRYPTO_VERIFY_SSL: ${CRYPTO_VERIFY_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      EDGE_WS_SCHEME: ${EDGE_WS_SCHEME:-ws}
    volumes:
      # Persistance de la base de données SQLite entre dev et prod
      - ./serveur_web/backend/data:/app/data
    networks:
      - pledge_net
    depends_on:
      - broker_mqtt
      - crypto_node
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./serveur_web/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: pledge-frontend:latest
    container_name: pledge_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - pledge_net
    depends_on:
      - backend

networks:
  pledge_net:
    driver: bridge

volumes:
  mosquitto_data:
  edge_storage_data:

