version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pledge_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BROKER_IP=10.4.19.234
      - BROKER_PORT=1883
      # Adaptez ces IP avec celles de vos serveurs crypto de zone
      - CRYPTO_URL_ZONE_1=https://10.4.19.234:8443
      - CRYPTO_URL_ZONE_2=https://10.4.19.235:8443

  frontend:
    build: ./frontend
    container_name: pledge_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      # L'URL du backend vue depuis le navigateur de l'utilisateur
      - VITE_API_URL=http://localhost:8000
