services:
  backend:
    build: ./backend
    container_name: pledge_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BROKER_IP=${TAILSCALE_IP_BROKER:-100.x.x.x}
      - BROKER_PORT=1883
      - CRYPTO_URL_ZONE_1=${TAILSCALE_URL_CRYPTO_1:-https://100.x.x.x:8443}
    volumes:
      - ./backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    container_name: pledge_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${TAILSCALE_URL_BACKEND:-http://100.x.x.x:8000}
