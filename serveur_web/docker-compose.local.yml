services:
  backend:
    build: ./backend
    container_name: pledge_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8448}:8000"
    environment:
      - BROKER_HOST=host.docker.internal
      - BROKER_PORT=1883
      - BROKER_IP=host.docker.internal
      - CRYPTO_URL_ZONE_1=https://host.docker.internal:8443
      - CRYPTO_VERIFY_SSL=false
      - DATABASE_URL=sqlite:///./data/app.db
      - EDGE_WS_SCHEME=ws
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: pledge_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
