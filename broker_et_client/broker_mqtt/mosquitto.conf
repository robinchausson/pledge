# ==========================================================
# Configuration Eclipse Mosquitto - Projet Pledge
# ==========================================================

# 1. Écoute MQTTS sécurisée avec TLS (conforme archi projet)
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# 2. Écoute standard MQTT (pour rétro-compatibilité locale)
listener 1883 0.0.0.0

# 3. Persistance des messages
persistence true
persistence_location /mosquitto/data/

# 4. Autorisation d'accès (peut être restreinte avec password_file en prod)
allow_anonymous true
