services:
  client_telemetrie:
    build: .
    container_name: client_mqtt_edge
    restart: always
    ports:
      - "8444:8444"
    environment:
      - BROKER_IP=${LAN_IP_BROKER:-192.168.x.x}
      - BROKER_PORT=1883
      - NODE_ID=${NODE_ID:-Edge_Node}
      - ZONE_ID=${ZONE_ID:-Zone_1}
      - PORT_WSS=8444
      - NODE_IP=${LAN_IP_NODE:-192.168.x.x}
    volumes:
      - /:/host_root:ro
