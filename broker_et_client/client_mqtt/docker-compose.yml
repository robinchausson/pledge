services:
  client_telemetrie:
    build: .
    container_name: client_mqtt_edge
    restart: always
    ports:
      - "8444:8444"
    environment:
      - BROKER_IP=${TAILSCALE_IP_BROKER:-100.x.x.x}
      - BROKER_PORT=1883
      - NODE_ID=${NODE_ID:-Tailscale_Edge_Node}
      - ZONE_ID=${ZONE_ID:-Zone_1}
      - PORT_WSS=8444
      - NODE_IP=${TAILSCALE_IP_NODE:-100.x.x.x}
      - STREAM_QUEUE_SIZE=${STREAM_QUEUE_SIZE:-64}
      - STORAGE_QUEUE_SIZE=${STORAGE_QUEUE_SIZE:-256}
      - STORAGE_BATCH_SIZE=${STORAGE_BATCH_SIZE:-8}
      - STORAGE_FLUSH_SECONDS=${STORAGE_FLUSH_SECONDS:-0.25}
    volumes:
      - /:/host_root:ro
