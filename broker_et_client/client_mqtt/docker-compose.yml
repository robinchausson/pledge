services:
  client_telemetrie:
    build: .
    container_name: client_mqtt_edge
    restart: always
    ports:
      - "8444:8444"
    environment:
      - BROKER_IP=${BROKER_IP:?Set BROKER_IP in client_mqtt/.env}
      - BROKER_PORT=1883
      - NODE_ID=${NODE_ID:-Edge_Node}
      - ZONE_ID=${ZONE_ID:-Zone_1}
      - PORT_WSS=8444
      - NODE_IP=${NODE_IP:?Set NODE_IP in client_mqtt/.env}
      - STREAM_QUEUE_SIZE=${STREAM_QUEUE_SIZE:-64}
      - STORAGE_QUEUE_SIZE=${STORAGE_QUEUE_SIZE:-512}
      - STORAGE_BATCH_SIZE=${STORAGE_BATCH_SIZE:-32}
      - STORAGE_FLUSH_SECONDS=${STORAGE_FLUSH_SECONDS:-0.5}
      - UPLOAD_ACK_EVERY=${UPLOAD_ACK_EVERY:-0}
    volumes:
      - /:/host_root:ro
