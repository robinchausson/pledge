version: '3.8'

services:
  client_telemetrie:
    build: .
    container_name: client_mqtt_edge
    restart: always
    ports:
      - "8444:8444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BROKER_IP=host.docker.internal
      - BROKER_PORT=1883
      - NODE_ID=Local_Edge_Node
      - ZONE_ID=Zone_1
      - PORT_WSS=8444
      - NODE_IP=host.docker.internal
      - STREAM_QUEUE_SIZE=64
      - STORAGE_QUEUE_SIZE=512
      - STORAGE_BATCH_SIZE=32
      - STORAGE_FLUSH_SECONDS=0.5
      - UPLOAD_ACK_EVERY=0
    volumes:
      - /:/host_root:ro
